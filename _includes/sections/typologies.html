<section id="typologies" class="py-16 md:py-24 border-t border-gray-200 dark:border-gray-800">
  <div class="max-w-3xl mx-auto text-center">
    <h2 class="text-3xl font-bold leading-tight tracking-[-0.015em] text-gray-900 dark:text-white">
      {{ i18n.typologies.heading }}
    </h2>
    <p class="mt-6 text-base md:text-lg text-gray-600 dark:text-gray-400">
      {{ i18n.typologies.intro_html }}
    </p>
  </div>
  <div class="mt-12 overflow-hidden rounded-lg border border-gray-200 dark:border-gray-800">
    <div class="grid grid-cols-1 md:grid-cols-{{ i18n.typologies.items | size }} divide-y md:divide-y-0 md:divide-x divide-gray-200 dark:divide-gray-800">
      {% for item in i18n.typologies.items %}
        <div class="p-6 bg-background-light/70 dark:bg-background-dark/40">
          <h3 class="text-lg font-bold text-gray-900 dark:text-white">{{ item.title }}</h3>
          <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">{{ item.body_html }}</p>
        </div>
      {% endfor %}
    </div>
  </div>
  <div class="mt-10 max-w-3xl mx-auto text-center space-y-6">
    <p class="text-base md:text-lg text-gray-600 dark:text-gray-400">{{ i18n.typologies.outro_html }}</p>
    <blockquote class="text-xl italic text-gray-700 dark:text-gray-300">“{{ i18n.typologies.quote }}”</blockquote>
  </div>
</section>
