<section id="typologies">
  <h2>{{ i18n.typologies.heading }}</h2>
  <p>{{ i18n.typologies.intro_html }}</p>
  <ul>
    {% for item in i18n.typologies.items_html %}
      <li>{{ item }}</li>
    {% endfor %}
  </ul>
  <p>{{ i18n.typologies.outro_html }}</p>
  <blockquote>{{ i18n.typologies.quote }}</blockquote>
</section>
