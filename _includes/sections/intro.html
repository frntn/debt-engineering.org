<section id="intro" class="py-20 md:py-32">
  <div class="text-center max-w-2xl mx-auto">
    <h1 class="text-4xl md:text-5xl font-black leading-tight tracking-[-0.033em] text-gray-900 dark:text-white">
      {{ i18n.intro.hero_title }}
    </h1>
    <p class="mt-4 text-base md:text-lg text-gray-600 dark:text-gray-400">
      {{ i18n.intro.hero_subtitle }}
    </p>
  </div>
  <div class="mt-16 md:mt-24 space-y-12">
    <blockquote class="text-center">
      <p class="text-2xl md:text-4xl font-bold leading-tight tracking-tight text-gray-800 dark:text-gray-200">
        {{ i18n.intro.quote }}
      </p>
    </blockquote>
    <div class="mx-auto max-w-3xl space-y-6 text-left text-lg text-gray-700 dark:text-gray-300">
      {% for paragraph in i18n.intro.paragraphs_html %}
        <p>{{ paragraph }}</p>
      {% endfor %}
    </div>
  </div>
</section>
