<section id="culture" class="py-16 md:py-24 border-t border-gray-200 dark:border-gray-800">
  <div class="max-w-3xl mx-auto text-center">
    <h2 class="text-3xl font-bold leading-tight tracking-[-0.015em] text-gray-900 dark:text-white">
      {{ i18n.culture.heading }}
    </h2>
  </div>
  <div class="mt-12 space-y-8 text-lg text-gray-700 dark:text-gray-300">
    {% for paragraph in i18n.culture.paragraphs_html %}
      <p>{{ paragraph }}</p>
    {% endfor %}
  </div>
  <div class="mt-12">
    <blockquote class="border-l-4 border-primary pl-6 text-xl italic text-gray-700 dark:text-gray-300">
      {{ i18n.culture.quote }}
    </blockquote>
  </div>
</section>
