intro:
  hero_title: "Debt Engineering"
  hero_subtitle: "Transformer la dette d'innovation en matériau de progrès."
  paragraphs_html:
    - "<em>Le cadre DEBT — Debt Engineering & Bet Tracking.</em>"
    - "Chaque acte d'innovation laisse des traces d'imperfection — raccourcis pris, expérimentations inachevées, systèmes poussés au-delà de leur intention. La plupart des organisations voient ces traces comme des passifs, les qualifiant de « dette ». Et si nous les considérions plutôt comme une <strong>preuve d'apprentissage</strong> ?"
    - "<strong>Debt Engineering</strong> requalifie la dette, d'un fardeau passif en matériau de conception actif. Il s'agit d'<em>ingénier la dette</em> — la rendre explicite, mesurable et précieuse — pour transformer la friction en clairvoyance. Effacer la dette, c'est effacer l'histoire ; la façonner, c'est gouverner l'évolution."
    - "En acceptant la dette comme une composante structurelle de la croissance des systèmes, les organisations peuvent passer de la culpabilité à la gouvernance — cultivant une relation plus lucide entre vitesse, risque et connaissance."
  quote: "La dette n'est pas le prix de l'innovation — c'est son enregistrement."
framework:
  heading: "Le cadre DEBT"
  description_html: "Le cadre DEBT — <strong>Debt Engineering & Bet Tracking</strong> — est un modèle auto-référentiel, à la fois philosophie et pratique. À l'image de l'acronyme récursif de GNU, il parle de lui-même : nous <em>forgons</em> la dette et <em>suivons</em> les paris qui la génèrent. Ce cycle structure l'innovation non comme du chaos, mais comme un <strong>métabolisme intentionnel de l'apprentissage</strong>."
  loop: "Façonner → Miser → Suivre → Transformer"
  steps:
    - title: "Ingénier"
      body_html: "Ingénier la dette, c'est la rendre visible et délibérée. Plutôt que de considérer des lacunes techniques accidentelles, nous reconnaissons les compromis comme des choix de conception."
      icon: "engineering"
    - title: "Parier"
      body_html: "Chaque innovation est un pari : un acte calculé d'incertitude visant une valeur future. Suivre les paris, c'est connaître leurs enjeux, leur durée et leur retour, transformant l'improvisation en discipline."
      icon: "casino"
    - title: "Suivre"
      body_html: "Suivre, ce n'est pas seulement mesurer les résultats, c'est observer ce que nous apprenons par l'échec et l'itération. La clé est le <em>rendement d'apprentissage</em> — la compréhension que chaque risque nous procure."
      icon: "monitoring"
    - title: "Transformer"
      body_html: "La transformation est l'endroit où la friction devient connaissance. Nous remboursons non pas en effaçant, mais en <em>transmutant</em> la dette en insight réutilisable — doctrines, heuristiques et culture issues de la contrainte."
      icon: "transform"
  quote: "Nous ne réparons pas la dette — nous l'instrumentons."
typologies:
  heading: "Au-delà des typologies classiques"
  intro_html: "La gestion traditionnelle de la dette se concentre sur trois axes — technique, fonctionnel et organisationnel. Mais dans le paysage contemporain, la dette d'innovation se manifeste sous des formes plus subtiles et systémiques. Debt Engineering propose une taxonomie plus riche qui embrasse l'écosystème complet de l'émergence."
  items:
    - title: "Structurelle"
      body_html: "Des compromis architecturaux qui permettent la vitesse tout en limitant l'optionalité future. L'objectif n'est pas l'évitement, mais la traçabilité."
    - title: "Cognitive"
      body_html: "Le décalage entre les outils disponibles et la compréhension humaine — le coût de l'apprentissage à grande échelle, indiquant où enseigner plutôt que blâmer."
    - title: "Expérimentale"
      body_html: "Le résidu de l'innovation rapide : prototypes, preuves de concept et premiers patterns. Le gérer, c'est distinguer la matière précieuse du déchet toxique."
    - title: "Organisationnelle"
      body_html: "Les désalignements entre le rythme de la gouvernance et celui de la livraison — des signaux révélant où la structure résiste à l'ambition."
    - title: "Éthique"
      body_html: "Le prix de la vitesse en termes humains et planétaires. Quand les choix dépassent la réflexion, la dette éthique rappelle que la durabilité est aussi un enjeu d'ingénierie."
  outro_html: "En cartographiant ces formes, nous créons une <strong>cartographie de l'apprentissage</strong>. La dette devient un prisme d'intelligence collective — une carte de nos audaces, de nos angles morts et de l'endroit où concentrer notre prochain acte de conception."
  quote: "Nous n'éliminons pas ces dettes — nous les intégrons à la conception du système."
culture:
  heading: "Le changement culturel"
  paragraphs_html:
    - "Dans les systèmes hérités, la dette est traitée comme un échec. On demande aux ingénieurs de la nettoyer ; aux managers, de la cacher ; aux dirigeants, de la nier. Mais dans les organisations émergentes, la dette devient un <strong>organe d'adaptation</strong> — le tissu cicatriciel qui renforce le système à chaque itération."
    - "Debt Engineering remplace la culture de la réparation par une culture de la compréhension. Elle apporte de la littératie à la complexité — rendant les équipes conscientes de la manière dont leurs choix façonnent la flexibilité future. Le <strong>Debt Engineer</strong> émerge comme un nouvel archétype : un designer de contingences, capable d'architecturer des systèmes qui portent le poids de leur propre évolution."
    - "C'est une inversion culturelle profonde : de la honte à la stratégie, de la culpabilité à la gouvernance. Elle permet aux organisations de cesser de craindre les résidus de leur progrès et de commencer à <em>en apprendre</em>."
  quote: "Plus nous allons vite, plus nous devons voir clairement nos dettes."
community:
  heading: "Rejoignez les bâtisseurs de la vélocité durable"
  paragraphs_html:
    - "Le cadre DEBT est ouvert — une discipline partagée pour celles et ceux qui conçoivent à la frontière de la complexité : architectes, data scientists, stratèges produit, innovateurs. Il unit la maîtrise technique et l'intention stratégique sous une même éthique : <strong>la vitesse consciente</strong>."
    - "Contribuez à l'évolution de ce cadre. Documentez vos patterns, vos expériences, vos apprentissages. Ensemble, nous construisons la grammaire d'une vitesse durable — une éthique de l'innovation qui reconnaît le coût du mouvement sans le paralyser."
  links:
    - href: "https://github.com/frntn/debt-engineering.github.io"
      label: "Voir sur GitHub"
      icon: "code"
    - href: "#"
      label: "Lire le manifeste"
      icon: "article"
    - href: "#"
      label: "Initier une discussion"
      icon: "forum"
  quote: "Debt Engineering est l'éthique de la vélocité — concevoir des systèmes qui apprennent plus vite qu'ils ne se brisent."
