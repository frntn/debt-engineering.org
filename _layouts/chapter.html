---
layout: base
---
<article class="prose prose-invert:dark max-w-none">
  <header class="mb-8 text-center">
    <h1 class="text-3xl md:text-4xl font-extrabold tracking-[-0.02em] text-gray-900 dark:text-white">{{ page.title }}</h1>
    {% if page.summary %}
      <p class="mt-3 text-lg text-gray-600 dark:text-gray-400">{{ page.summary }}</p>
    {% endif %}
  </header>
  <div class="content text-gray-800 dark:text-gray-200 leading-relaxed">
    {{ content }}
  </div>
</article>
