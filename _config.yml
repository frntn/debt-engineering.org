title: Debt Engineering
tagline: The DEBT Framework
description: Debt Engineering & Bet Tracking — a new paradigm for managing innovation debt as a material for learning, not a liability.
url: https://debt-engineering.org
lang: en
locale: en_US
default_lang: en
languages:
  - en
  - fr
permalink: "/:path/"
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
collections:
  chapters:
    output: true
    permalink: /chapters/:path/
  practices:
    output: true
    permalink: /practices/:path/
  patterns:
    output: true
    permalink: /patterns/:path/
  cases:
    output: true
    permalink: /cases/:path/
  reference:
    output: true
    permalink: /reference/:path/
  glossary:
    output: true
    permalink: /glossary/:path/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
    values:
      layout: home
      lang: en
      image:
        path: /assets/og-image.png
        width: 1200
        height: 630
        alt: Debt Engineering — The DEBT Framework
      twitter:
        card: summary_large_image
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - .jekyll-cache
