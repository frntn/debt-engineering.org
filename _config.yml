title: Debt Engineering
description: Debt Engineering & Bet Tracking — a new paradigm for managing innovation debt as a material for learning, not a liability.
default_lang: en
languages:
  - en
  - fr
permalink: "/:path/"
collections:
  posts:
    output: false
  chapters:
    output: true
    permalink: /chapters/:path/
  practices:
    output: true
    permalink: /practices/:path/
  patterns:
    output: true
    permalink: /patterns/:path/
  cases:
    output: true
    permalink: /cases/:path/
  reference:
    output: true
    permalink: /reference/:path/
  glossary:
    output: true
    permalink: /glossary/:path/
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
    values:
      layout: home
      lang: en
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
